name: Verify platform
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: mvn -B -f backend/pom.xml package
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run build
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Live browser workflow
        run: |
          java -jar backend/target/squad-0.1.0.jar > /tmp/backend.log 2>&1 &
          npm --prefix frontend run dev -- --port 5173 --strictPort > /tmp/frontend.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/actuator/health && curl -fsS http://127.0.0.1:5173/ > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/actuator/health
          npm --prefix frontend run test:e2e
      - name: Build and smoke-test packaged container
        run: |
          docker build -t touchline:ci .
          docker run -d --name touchline-ci --read-only --tmpfs /tmp:size=128m --cap-drop ALL --security-opt no-new-privileges:true -e SPRING_PROFILES_ACTIVE=dev -p 127.0.0.1:8180:8080 touchline:ci
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8180/actuator/health; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8180/actuator/health
          curl -fsS http://127.0.0.1:8180/ | grep -q Touchline
          docker exec touchline-ci bash /app/healthcheck.sh
      - name: Remove test container
        if: always()
        run: docker rm -f touchline-ci || true
